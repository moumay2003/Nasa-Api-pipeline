name: Python Validation

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - '**.py'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - '**.py'

jobs:
  validate-python-syntax:
    name: Validate Python Syntax
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Check Python syntax
      run: |
        python -m py_compile $(find . -name "*.py" -not -path "./venv/*" -not -path "./.venv/*")
    
    - name: Validate Python version compatibility
      run: |
        python -m pip install --upgrade pip
        if [ -f validate_python_versions.py ]; then
          pip install docker
          echo "Python version validation script found"
        fi
  
  check-requirements:
    name: Check Requirements Files
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Validate requirements.txt
      run: |
        if [ -f requirements.txt ]; then
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
        fi
    
    - name: Validate requirements-airflow.txt
      run: |
        if [ -f requirements-airflow.txt ]; then
          python -m pip install --upgrade pip
          pip install -r requirements-airflow.txt
          pip check
        fi
